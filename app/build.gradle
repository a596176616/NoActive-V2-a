plugins {
    id 'com.android.application'
}
apply plugin: 'kotlin-android'

android {
    namespace 'cn.myflv.noactive'
    compileSdk 36

    buildFeatures {
        aidl true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        applicationId "cn.myflv.noactive"
        minSdk 29
        targetSdk 36
        versionCode 266
        versionName "2.7-Alpha"
    }

    signingConfigs {
        release {
            // v0.9.10 port: 复用 Android debug keystore，便于个人开发调试与升级覆盖安装
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.majorVersion
    }

    // API 102: META-INF/xposed/* 资源合并配置
    packagingOptions {
        resources {
            merges += "META-INF/xposed/*"
        }
    }

    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
                //这里修改apk文件名
                outputFileName = "NoActive-${variant.versionName}(${versionCode}).apk"
            }
    }
}

dependencies {
    // API 102 升级: de.robv.android.xposed:api:82 → io.github.libxposed:api:102.0.0
    // LSPosed 2.0.3: targetApiVersion=102 时禁止调用 Legacy API
    compileOnly 'io.github.libxposed:api:102.0.0'
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    implementation project(':blockmiui')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation "androidx.core:core-ktx:1.18.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    def libsuVersion = '5.0.3'
    implementation "com.github.topjohnwu.libsu:core:${libsuVersion}"
    implementation "com.github.topjohnwu.libsu:io:${libsuVersion}"
}
